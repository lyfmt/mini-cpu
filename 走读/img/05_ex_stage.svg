  <text x="622" y="86" class="nb" style="fill:#1c7ed6">转发选择器  cpu_core.v:264-275</text>
  <text x="622" y="106" class="note">00 ID 段读出值 · 01 WB 写回值 wb_busW · 10 EX/M 的 m_aluout</text>
  <text x="622" y="125" class="note">选择信号来自 forward_unit.v:33-36（M 段优先）。fwdA/fwdB 同时送</text>
  <text x="622" y="144" class="note">ALU、模乘单元、比较单元、jalr 基地址和 store 数据</text>
  <rect x="612" y="234" width="470" height="112" rx="6" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/>
  <text x="622" y="254" class="nb" style="fill:#7048e8">④ 模乘单元与 ALU 并排  cpu_core.v:297-313</text>
  <text x="622" y="274" class="note">输入就是 ALU 两端 ex_alu_a / ex_alu_b（qmul 的 A 端选 rs1、B 端选 rs2）</text>
  <text x="622" y="293" class="note">结果选择器 :313：ALUctr == QMUL 时取模乘输出，否则取 ALU</text>
  <text x="622" y="312" class="note">之后存进 m_aluout，转发、写回都和 add 完全一样，冒险逻辑没改</text>
  <text x="622" y="331" class="note">HAS_QMUL = 0 时走 g_no_qmul 分支，ex_qmul_y 恒 0</text>
  <rect x="612" y="350" width="470" height="58" rx="6" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/>
  <text x="622" y="370" class="nb" style="fill:#0c8599">⑤ 比较单元  cpu_core.v:315-323，branch_cmp.v</text>
  <text x="622" y="390" class="note">用转发后的 rs1/rs2，按 BrOp（= funct3）给出 6 种分支条件</text>
  <rect x="612" y="432" width="470" height="40" rx="6" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/>
  <text x="622" y="452" class="nb" style="fill:#2f9e44">③ m_busB &lt;= ex_fwdB  cpu_core.v:361（见图 06）</text>
  <rect x="612" y="562" width="470" height="58" rx="6" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/>
  <text x="622" y="582" class="nb" style="fill:#0c8599">⑤ 目标加法器  cpu_core.v:325-328</text>
  <text x="622" y="602" class="note">TargetSrc 选 PC（分支、jal）或转发后的 rs1（jalr），结果最低位清零</text>
