<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="648" viewBox="0 0 1200 648">
  <style>
    text { font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #212529; }
    .h  { font-size: 19px; font-weight: bold; }
    .sub { font-size: 13px; fill: #495057; }
    .cyc { font-size: 13px; font-weight: bold; fill: #495057; }
    .ins { font-family: Consolas, 'Microsoft YaHei', 'Noto Sans Mono CJK SC', monospace; font-size: 13px; }
    .pc  { font-family: Consolas, 'Microsoft YaHei', 'Noto Sans Mono CJK SC', monospace; font-size: 12px; fill: #868e96; }
    .cell { font-size: 13px; font-weight: bold; }
    .note { font-size: 13px; }
    .nb { font-size: 13px; font-weight: bold; }
    .code { font-family: Consolas, 'Microsoft YaHei', 'Noto Sans Mono CJK SC', monospace; font-size: 12.5px; }
    .small { font-size: 11.5px; fill: #495057; }
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#f1f3f5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#ced4da" stroke-width="2"/>
    </pattern>
    <marker id="a_blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1c7ed6"/></marker>
    <marker id="a_green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2f9e44"/></marker>
    <marker id="a_orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#e8590c"/></marker>
    <marker id="a_pink" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#d6336c"/></marker>
    <marker id="a_violet" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#7048e8"/></marker>
    <marker id="a_gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker>
    <marker id="a_red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#e03131"/></marker>
    <marker id="a_teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#0c8599"/></marker>
  </defs>
  <rect width="1200" height="648" fill="#ffffff"/>
  <text x="600" y="30" text-anchor="middle" class="h">定制指令 qmul：rd ← (rs1[11:0] × rs2[11:0]) mod 3329，EX 段一拍完成</text>
  <text x="600" y="52" text-anchor="middle" class="sub">数值取自演示 qmul（prebuilt/rv32i_qmul/demo/qmul）：qmul x5, x1, x2，x1 = 1234，x2 = 2345</text>
  <rect x="150" y="74" width="196" height="44" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/>
  <text x="248.0" y="92" text-anchor="middle" class="small">funct7 [31:25]</text>
  <text x="248.0" y="111" text-anchor="middle" class="code" style="fill:#7048e8">0000000</text>
  <rect x="346" y="74" width="140" height="44" fill="#fff" stroke="#7048e8" stroke-width="1.6"/>
  <text x="416.0" y="92" text-anchor="middle" class="small">rs2 [24:20]</text>
  <text x="416.0" y="111" text-anchor="middle" class="code">x2</text>
  <rect x="486" y="74" width="140" height="44" fill="#fff" stroke="#7048e8" stroke-width="1.6"/>
  <text x="556.0" y="92" text-anchor="middle" class="small">rs1 [19:15]</text>
  <text x="556.0" y="111" text-anchor="middle" class="code">x1</text>
  <rect x="626" y="74" width="84" height="44" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/>
  <text x="668.0" y="92" text-anchor="middle" class="small">funct3 [14:12]</text>
  <text x="668.0" y="111" text-anchor="middle" class="code" style="fill:#7048e8">000</text>
  <rect x="710" y="74" width="140" height="44" fill="#fff" stroke="#7048e8" stroke-width="1.6"/>
  <text x="780.0" y="92" text-anchor="middle" class="small">rd [11:7]</text>
  <text x="780.0" y="111" text-anchor="middle" class="code">x5</text>
  <rect x="850" y="74" width="196" height="44" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/>
  <text x="948.0" y="92" text-anchor="middle" class="small">opcode [6:0]</text>
  <text x="948.0" y="111" text-anchor="middle" class="code" style="fill:#7048e8">0001011</text>
  <text x="140" y="101" text-anchor="end" class="nb">R 型格式</text>
  <text x="1054" y="92" text-anchor="start" class="nb" style="fill:#7048e8">custom-0</text>
  <text x="1054" y="111" text-anchor="start" class="small">留给用户</text>
  <text x="150" y="140" text-anchor="start" class="note">机器码 0x0020828b；汇编器不用改，用 .insn 包成宏（sw/common/qmul.h）。control.v:147-155 译码：只有 funct3 = 000、funct7 = 0 才是 qmul。</text>
  <rect x="10" y="160" width="1180" height="190" rx="8" fill="#fcfcfd" stroke="#e9ecef"/>
  <text x="24" y="182" text-anchor="start" class="nb">qmul_unit.v 内部（Barrett 约简，q = 3329）</text>
  <text x="20" y="250" text-anchor="start" class="code">a = rs1[11:0]</text>
  <text x="20" y="268" text-anchor="start" class="code" style="fill:#7048e8">= 1234</text>
  <text x="20" y="300" text-anchor="start" class="code">b = rs2[11:0]</text>
  <text x="20" y="318" text-anchor="start" class="code" style="fill:#7048e8">= 2345</text>
  <polyline points="118,262 138,262 138,262 160,262" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#a_gray)"/>
  <polyline points="118,312 138,312 138,280 160,280" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#a_gray)"/>
  <rect x="160" y="236" width="110" height="68" rx="6" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
  <text x="215.0" y="260" text-anchor="middle" class="nb" style="fill:#7048e8">① 乘法 1</text>
  <text x="215.0" y="280" text-anchor="middle" class="small">a × b，12×12 位</text>
  <text x="215.0" y="298" text-anchor="middle" class="code">p = 2893730</text>
  <text x="215.0" y="324" text-anchor="middle" class="small">:28</text>
  <polyline points="270,270 300,270" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#a_gray)"/>
  <rect x="300" y="236" width="130" height="68" rx="6" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
  <text x="365.0" y="260" text-anchor="middle" class="nb" style="fill:#7048e8">② 乘法 2</text>
  <text x="365.0" y="280" text-anchor="middle" class="small">p × 5039 → pm 37 位</text>
  <text x="365.0" y="298" text-anchor="middle" class="code">qhat = 869</text>
  <text x="365.0" y="324" text-anchor="middle" class="small">:29-31 取 [36:24]</text>
  <polyline points="430,270 460,270" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#a_gray)"/>
  <rect x="460" y="236" width="120" height="68" rx="6" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
  <text x="520.0" y="260" text-anchor="middle" class="nb" style="fill:#7048e8">③ 乘法 3</text>
  <text x="520.0" y="280" text-anchor="middle" class="small">qhat × 3329</text>
  <text x="520.0" y="298" text-anchor="middle" class="code">qq = 2892901</text>
  <text x="520.0" y="324" text-anchor="middle" class="small">:32</text>
  <polyline points="580,270 610,270" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#a_gray)"/>
  <rect x="610" y="236" width="130" height="68" rx="6" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
  <text x="675.0" y="260" text-anchor="middle" class="nb" style="fill:#7048e8">④ 减法</text>
  <text x="675.0" y="280" text-anchor="middle" class="small">r = p − qq</text>
  <text x="675.0" y="298" text-anchor="middle" class="code">r = 829</text>
  <text x="675.0" y="324" text-anchor="middle" class="small">:33-34，r ∈ [0, 2q)</text>
  <polyline points="740,270 770,270" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#a_gray)"/>
  <rect x="770" y="236" width="150" height="68" rx="6" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
  <text x="845.0" y="260" text-anchor="middle" class="nb" style="fill:#7048e8">⑤ 条件减</text>
  <text x="845.0" y="280" text-anchor="middle" class="small">r ≥ 3329 ? r−3329 : r</text>
  <text x="845.0" y="298" text-anchor="middle" class="code">res = 829</text>
  <text x="845.0" y="324" text-anchor="middle" class="small">:35、:39</text>
  <polyline points="920,270 950,270" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#a_gray)"/>
  <rect x="950" y="236" width="120" height="68" rx="6" fill="#fff" stroke="#212529" stroke-width="2"/>
  <text x="1010.0" y="260" text-anchor="middle" class="nb" style="fill:#212529">输出</text>
  <text x="1010.0" y="280" text-anchor="middle" class="small">y = {20'b0, res}</text>
  <text x="1010.0" y="298" text-anchor="middle" class="code">y = 829</text>
  <text x="1010.0" y="324" text-anchor="middle" class="small">:41</text>
  <polyline points="1070,270 1100,270" fill="none" stroke="#7048e8" stroke-width="2.2" marker-end="url(#a_violet)"/>
  <text x="1106" y="262" text-anchor="start" class="code" style="fill:#7048e8">ex_qmul_y</text>
  <text x="1106" y="282" text-anchor="start" class="small">→ 结果选择器</text>
  <polyline points="215,236 215,206 675,206 675,232" fill="none" stroke="#495057" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#a_gray)"/>
  <text x="445" y="200" text-anchor="middle" class="small">p 直接送到减法器</text>
  <rect x="10" y="362" width="585" height="122" rx="6" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/>
  <text x="20" y="382" class="nb" style="fill:#7048e8">为什么只要减一次</text>
  <text x="20" y="402" class="note">5039 = floor(2²⁴ / 3329)，qhat 是商的估计值，不会偏大、最多少 1，</text>
  <text x="20" y="421" class="note">所以 r = p − qhat·q 落在 [0, 2q)，最后最多再减一次 q。</text>
  <text x="20" y="440" class="note">这个范围已对 4096 × 4096 种输入穷举验证（qhat 最大 5036）。</text>
  <text x="20" y="459" class="note">三个乘法都在 DSP48E1 的 25 × 18 之内。</text>
  <rect x="605" y="362" width="585" height="122" rx="6" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/>
  <text x="615" y="382" class="nb" style="fill:#e03131">位宽陷阱</text>
  <text x="615" y="402" class="code">wire [36:0] pm = p * M;   wire [12:0] qhat = pm[36:24];</text>
  <text x="615" y="421" class="note">pm 必须声明成 37 位（24 + 13）。如果直接写 (p * M) &gt;&gt; 24，</text>
  <text x="615" y="440" class="note">Verilog 按操作数里最宽的 24 位来算乘积，高位先被截掉，</text>
  <text x="615" y="459" class="note">qhat 就错了。</text>
  <rect x="10" y="496" width="585" height="142" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/>
  <text x="20" y="516" class="nb" style="fill:#1c7ed6">放进流水线</text>
  <text x="20" y="536" class="note">控制信号和 R 型一样（RegWr、UseRs1、UseRs2 = 1），只是 ALUctr = 1001；</text>
  <text x="20" y="555" class="note">结果走 m_aluout 这条运算结果通路，所以转发、load-use、冲刷全部照常。</text>
  <text x="20" y="574" class="note">演示里：C18 qmul 在 EX 得到 829；C19 紧跟的 add x6,x5,x3 在 EX，</text>
  <text x="20" y="593" class="note">BusAFw = 10（A ← M）拿到 829；C20 写 x5 = 829，C21 写 x6 = 1829。</text>
  <text x="20" y="612" class="note">冒险逻辑一行没改，这是"新功能走已有的路"的回报。</text>
  <rect x="605" y="496" width="585" height="142" rx="6" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/>
  <text x="615" y="516" class="nb" style="fill:#e8590c">代价</text>
  <text x="615" y="536" class="note">Vivado 实现（HAS_QMUL = 1，10 ns 约束）：DSP48E1 共 4 个，全在模乘里；</text>
  <text x="615" y="555" class="note">最长路径：ex_rs1 → 转发比较 → ALU A 端 → 模乘的 4 级 DSP → m_aluout，</text>
  <text x="615" y="574" class="note">数据路径 18.58 ns，WNS = −8.651 ns，约 53.6 MHz。</text>
  <text x="615" y="593" class="note">设计文档第七节说过不追求高主频，这是这条指令的代价之一；</text>
  <text x="615" y="612" class="note">有无模乘的对比用 syn\run_syn.bat 两种配置各跑一次。</text>
</svg>
