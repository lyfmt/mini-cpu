  <line x1="20" y1="356" x2="1134" y2="356" stroke="#e9ecef"/>
  <text x="606" y="78" text-anchor="middle" class="nb" style="fill:#d6336c">stall = 1</text>
  <rect x="751" y="147" width="94" height="82" rx="7" fill="none" stroke="#1c7ed6" stroke-width="3"/>
  <text x="798.0" y="376" text-anchor="middle" class="nb" style="fill:#1c7ed6">A ← WB</text>
  <rect x="655" y="147" width="94" height="82" rx="7" fill="none" stroke="#e03131" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="702.0" y="376" text-anchor="middle" class="nb" style="fill:#e03131">若不停?</text>
  <rect x="20" y="394" width="372" height="98" rx="6" fill="#fff0f6" stroke="#d6336c" stroke-width="1.6"/>
  <text x="30" y="414" class="nb" style="fill:#d6336c">① C16 检测到冲突  hazard_unit.v:26-28</text>
  <text x="30" y="434" class="code">ex_MemRead = 1        EX 段是 lw</text>
  <text x="30" y="453" class="code">ex_rd = x5，不是 x0</text>
  <text x="30" y="472" class="code">id_UseRs1 = 1, id_rs1 = x5  → use1 = 1</text>
  <rect x="408" y="394" width="380" height="98" rx="6" fill="#fff0f6" stroke="#d6336c" stroke-width="1.6"/>
  <text x="418" y="414" class="nb" style="fill:#d6336c">② C16 的时钟沿上生效  cpu_core.v</text>
  <text x="418" y="434" class="code">PC    : else if (!stall) 才 +4     :99</text>
  <text x="418" y="453" class="code">IF/ID : else if (!stall) 才锁存    :111</text>
  <text x="418" y="472" class="code">ID/EX : if (rst||flush||stall) 气泡 :196</text>
  <rect x="804" y="394" width="376" height="98" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/>
  <text x="814" y="414" class="nb" style="fill:#1c7ed6">③ 停一拍后用普通 WB 转发  forward_unit.v:33</text>
  <text x="814" y="434" class="code">C18 lw 在 WB、add 在 EX → BusAFw = 01</text>
  <text x="814" y="453" class="code">fwdA = wb_busW = 0x12345678</text>
  <text x="814" y="472" class="code">C20 写回 x6 = 0x12345679</text>
  <rect x="20" y="508" width="1160" height="84" rx="6" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/>
  <text x="30" y="528" class="nb" style="fill:#e03131">为什么非停不可</text>
  <text x="30" y="548" class="note">C17 如果不停，add 已进 EX 要用 x5，而 lw 还在 M 段读存储器：EX/M 里的 m_aluout 只是访存地址，所以 forward_unit 用 !m_MemRead 把</text>
  <text x="30" y="567" class="note">M 段的 load 排除在转发来源之外。停一拍让 lw 进到 M/WB，数据就能从 WB 转发过来。代价是每次 load-use 多 1 拍，STALLS 计数器 +1。</text>
