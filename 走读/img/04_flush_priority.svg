  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="30" text-anchor="middle" class="h">跳转冲刷与"冲刷优先"：beq 成立，错误路径上恰好有一对 load-use</text>
  <text x="600" y="52" text-anchor="middle" class="sub">冒险测试 flush_stall（prebuilt/base9/hazard/flush_stall），每一格取自仿真的 +PIPE 时空图</text>
