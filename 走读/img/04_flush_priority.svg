  <text x="990.0" y="256.0" text-anchor="middle" class="cell" fill="#868e96" style="fill:#868e96">气泡</text>
  <line x1="20" y1="272" x2="1134" y2="272" stroke="#e9ecef"/>
  <text x="24" y="298.0" class="pc">0x70</text>
  <text x="68" y="298.0" class="ins">add x20,x20,x21 目标</text>
  <rect x="658" y="277" width="88" height="32" rx="5" fill="#d0ebff" stroke="#868e96"/>
  <text x="702.0" y="298.0" text-anchor="middle" class="cell">IF</text>
  <rect x="754" y="277" width="88" height="32" rx="5" fill="#fff3bf" stroke="#868e96"/>
  <text x="798.0" y="298.0" text-anchor="middle" class="cell">ID</text>
  <rect x="850" y="277" width="88" height="32" rx="5" fill="#d3f9d8" stroke="#868e96"/>
  <text x="894.0" y="298.0" text-anchor="middle" class="cell">EX</text>
  <rect x="946" y="277" width="88" height="32" rx="5" fill="#ffe8cc" stroke="#868e96"/>
  <text x="990.0" y="298.0" text-anchor="middle" class="cell">M</text>
  <rect x="1042" y="277" width="88" height="32" rx="5" fill="#e5dbff" stroke="#868e96"/>
  <text x="1086.0" y="298.0" text-anchor="middle" class="cell">WB</text>
  <line x1="20" y1="314" x2="1134" y2="314" stroke="#e9ecef"/>
  <text x="606" y="78" text-anchor="middle" class="nb" style="fill:#e8590c">flush = 1</text>
  <rect x="559" y="147" width="94" height="82" rx="7" fill="none" stroke="#d6336c" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="606.0" y="334" text-anchor="middle" class="nb" style="fill:#d6336c">load_use = 1</text>
  <text x="606.0" y="352" text-anchor="middle" class="nb" style="fill:#d6336c">stall = 0</text>
  <polyline points="650,125.0 654,125.0 654,293.0 659,293.0" fill="none" stroke="#e8590c" stroke-width="2.4" marker-end="url(#a_orange)"/>
  <text x="802" y="130.0" class="nb" style="fill:#e8590c">PC ← m_target = 0x70</text>
  <rect x="20" y="370" width="575" height="98" rx="6" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/>
  <text x="30" y="390" class="nb" style="fill:#e8590c">① C27：beq 在 M 段确认跳转</text>
  <text x="30" y="410" class="code">m_redirect = (m_Branch &amp; m_cond) | m_Jump      cpu_core.v:375</text>
  <text x="30" y="429" class="note">目标 0x70 早在 EX 段由目标加法器算好，存在 EX/M 的 m_target 里</text>
  <text x="30" y="448" class="note">（:328、:357）。M 段的选择信号全部来自寄存器，时序宽松。</text>
  <rect x="605" y="370" width="575" height="98" rx="6" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/>
  <text x="615" y="390" class="nb" style="fill:#e8590c">② C27 的时钟沿上生效</text>
  <text x="615" y="410" class="note">PC ← 0x70　　　　　　　　　　　　　　　　cpu_core.v:97-98</text>
  <text x="615" y="429" class="note">IF/ID、ID/EX、EX/M 写气泡　　　　　　cpu_core.v:107 / 196 / 334</text>
  <text x="615" y="448" class="note">M/WB 不冲刷：beq 本身照常在 C28 退休</text>
  <rect x="20" y="480" width="575" height="98" rx="6" fill="#fff0f6" stroke="#d6336c" stroke-width="1.6"/>
  <text x="30" y="500" class="nb" style="fill:#d6336c">③ 同一拍也检测到 load-use，冲刷优先</text>
  <text x="30" y="520" class="note">lw x1 在 EX、add x2,x1,x1 在 ID，load_use = 1；</text>
  <text x="30" y="539" class="code">stall = load_use &amp; ~flush = 0                  hazard_unit.v:31</text>
  <text x="30" y="558" class="note">如果让停顿优先，PC 会停在 0x6c，这次跳转就丢了。</text>
  <rect x="605" y="480" width="575" height="98" rx="6" fill="#f8f9fa" stroke="#495057" stroke-width="1.6"/>
  <text x="615" y="500" class="nb" style="fill:#495057">④ 代价与安全性</text>
  <text x="615" y="520" class="note">C29、C30、C31 三拍 WB 没有指令退休：每次跳转成立损失 3 拍；</text>
  <text x="615" y="539" class="note">不跳转没有任何代价（相当于静态预测"不跳"）。被冲刷的指令最远</text>
  <text x="615" y="558" class="note">只走到 EX，还没写存储器（M）和寄存器（WB），作废是安全的。</text>
