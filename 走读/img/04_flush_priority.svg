  <text x="702.0" y="214.0" text-anchor="middle" class="cell" fill="#868e96" style="fill:#868e96">气泡</text>
  <rect x="754" y="193" width="88" height="32" rx="5" fill="url(#hatch)" stroke="#adb5bd"/>
  <text x="798.0" y="214.0" text-anchor="middle" class="cell" fill="#868e96" style="fill:#868e96">气泡</text>
