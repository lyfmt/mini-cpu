  <rect x="543" y="592" width="50" height="18" rx="4" fill="#d3f9d8" stroke="#e8590c" stroke-width="2"/><line x1="559" y1="595" x2="577" y2="607" stroke="#e8590c" stroke-width="2"/><line x1="577" y1="595" x2="559" y2="607" stroke="#e8590c" stroke-width="2"/><text x="601" y="606" class="small">被冲刷</text>
